---
- name: Minimal Nginx setup (clean index with IP)
  hosts: web
  gather_facts: false
  become: true

  tasks:
    - name: Ensure Nginx installed
      raw: dpkg -l nginx >/dev/null 2>&1 || apt-get install -y --no-install-recommends nginx
      register: nginx_install
      changed_when: "'installed' in nginx_install.stderr or 'newly installed' in nginx_install.stdout"
      failed_when: nginx_install.rc != 0 and 'already the newest' not in nginx_install.stderr

    - name: Deploy clean index.html (VM number + IP)
      raw: |
        mkdir -p /var/www/html
        cat > /var/www/html/index.html <<EOF
        >>>>>>>>>>> I am vm{{ inventory_hostname | regex_replace('vm-', '') }} ({{ ansible_host }}) <<<<<<<<<<<<
        EOF
      changed_when: true

    - name: Validate and restart Nginx
      raw: nginx -t && systemctl daemon-reload && systemctl enable --now nginx
      changed_when: true
