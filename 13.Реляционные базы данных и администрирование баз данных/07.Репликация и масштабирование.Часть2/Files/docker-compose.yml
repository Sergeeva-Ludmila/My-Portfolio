---
version: "3.9"

services:
  users-m1:
    image: mysql:8.0
    container_name: users-m1
    command: >-
      --server-id=101
      --gtid_mode=ON
      --enforce_gtid_consistency=ON
      --binlog_format=ROW
      --log-bin=mysql-bin
      --max_binlog_size=100M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: db_users
      MYSQL_USER: ${MYSQL_APP_USER}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    volumes:
      - users-m1-data:/var/lib/mysql
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  users-s1:
    image: mysql:8.0
    container_name: users-s1
    command: >-
      --server-id=102
      --gtid_mode=ON
      --enforce_gtid_consistency=ON
      --binlog_format=ROW
      --read_only=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - users-s1-data:/var/lib/mysql
    networks:
      - db-net
    depends_on:
      users-m1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

