    volumes:
      - users-s2-data:/var/lib/mysql
    networks:
      - db-net
    depends_on:
      users-m1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
