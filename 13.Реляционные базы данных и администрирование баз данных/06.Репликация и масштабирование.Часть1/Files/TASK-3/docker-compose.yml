services:
  mysql-db1:
    image: mysql:8.0
    container_name: mysql-db1
    restart: unless-stopped
    env_file:
      - ./conf/.env
    ports:
      - "3308:3306"
    volumes:
      - ./db1/my.cnf:/etc/mysql/conf.d/db1.cnf:ro
      - mysql_data_db1:/var/lib/mysql
    networks:
      - repl-net

  mysql-db2:
    image: mysql:8.0
    container_name: mysql-db2
    restart: unless-stopped
    env_file:
      - ./conf/.env
    ports:
      - "3309:3306"
    volumes:
      - ./db2/my.cnf:/etc/mysql/conf.d/db2.cnf:ro
      - mysql_data_db2:/var/lib/mysql
    networks:
      - repl-net

volumes:
  mysql_data_db1:
  mysql_data_db2:

networks:
  repl-net:
    driver: bridge
