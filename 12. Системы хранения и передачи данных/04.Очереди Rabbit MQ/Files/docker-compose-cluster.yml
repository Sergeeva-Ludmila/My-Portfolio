version: '3.8'

services:
  rmq01:
    image: rabbitmq:3.12-management
    container_name: rmq01
    hostname: rmq01
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_ERLANG_COOKIE=${RABBITMQ_ERLANG_COOKIE}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rmq01_data:/var/lib/rabbitmq

  rmq02:
    image: rabbitmq:3.12-management
    container_name: rmq02
    hostname: rmq02
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_ERLANG_COOKIE=${RABBITMQ_ERLANG_COOKIE}
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rmq02_data:/var/lib/rabbitmq

volumes:
  rmq01_data:
  rmq02_data:

